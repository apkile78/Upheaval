<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="utf-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1" />  
<title>probably-not-a-very-good-project-</title>  
<style>  
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }  
  #game { display: block; width: 100vw; height: 100vh; }  
  #hud {  
    position: fixed; top: 8px; left: 8px; margin: 0;  
    font: 13px/1.4 monospace; color: #ddd; white-space: pre;  
    text-shadow: 0 1px 2px #000; pointer-events: none;  
  }  
</style>  
</head>  
<body>  
  <canvas id="game"></canvas>  
  <div id="hud"></div>  
  <div id="inv" style="  
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);  
  min-width:220px; max-height:60%; overflow:auto; display:none;  
  padding:12px 16px; background:#111d; color:#eee;  
  font:14px monospace; border:1px solid #555; z-index:50; white-space:pre;">  
  </div>
  <div id="overmap" style="  
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);  
  min-width:220px; max-height:80%; overflow:auto; display:none;  
  padding:12px 16px; background:#111d; color:#eee;  
  font:14px monospace; border:1px solid #555; z-index:50; white-space:pre;">  
</div>
  
  <!-- on-screen error overlay: catches errors WITHOUT devtools -->  
  <script>  
    window.addEventListener("error", (e) => {  
      const box = document.createElement("pre");  
      box.style.cssText =  
        "position:fixed;bottom:0;left:0;right:0;max-height:50%;overflow:auto;" +  
        "margin:0;padding:8px;background:#300;color:#f88;font:12px monospace;z-index:9999;white-space:pre-wrap;";  
      box.textContent =  
        "ERROR: " + (e.message || e.error) +  
        "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "");  
      document.body.appendChild(box);  
    });  
    window.addEventListener("unhandledrejection", (e) => {  
      const box = document.createElement("pre");  
      box.style.cssText =  
        "position:fixed;bottom:0;left:0;right:0;padding:8px;background:#300;color:#f88;font:12px monospace;z-index:9999;white-space:pre-wrap;";  
      box.textContent = "PROMISE REJECTION: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason);  
      document.body.appendChild(box);  
    });  
  </script>  
  
  <script type="module" src="src/main.js"></script>  
</body>
</html>
